name: Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "cmd/agent/**"
      - "cmd/client/**"
      - "internal/**"
      - "deploy/windows/**"
      - ".github/workflows/windows-installer.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "0.1.0-${{ github.run_number }}" }
          $version = $version.TrimStart("v")
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build installer
        shell: powershell
        run: |
          .\deploy\windows\build-installer.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Write checksum manifest
        shell: powershell
        run: |
          .\deploy\release\write-checksums.ps1 -InputDir .\dist\windows-installer\out

      - name: Write Windows update manifest
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $notesUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          .\deploy\release\write-windows-update-manifest.ps1 `
            -InputDir .\dist\windows-installer\out `
            -Version $version `
            -Channel beta `
            -BaseDownloadUrl $baseUrl `
            -ReleaseNotesUrl $notesUrl
          if ($version -notmatch '-') {
            .\deploy\release\write-windows-update-manifest.ps1 `
              -InputDir .\dist\windows-installer\out `
              -Version $version `
              -Channel stable `
              -BaseDownloadUrl $baseUrl `
              -ReleaseNotesUrl $notesUrl
          }

      - name: Install Cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v3

      - name: Sign Windows release blobs
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $files = Get-ChildItem -Path .\dist\windows-installer\out -File |
            Where-Object { $_.Name -match '\.exe$|\.txt$|\.json$' }
          foreach ($file in $files) {
            & cosign sign-blob --yes `
              "--output-signature=$($file.FullName).sig" `
              "--output-certificate=$($file.FullName).pem" `
              $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "cosign sign-blob failed for $($file.FullName)"
            }
          }

      - name: Upload staged Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: ole-windows-stage
          path: dist/windows-installer/stage/*

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ole-windows-installer
          path: dist/windows-installer/out/*

      - name: Attach installer to GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-installer/out/*

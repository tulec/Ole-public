global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ole-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - ole-server:8080
        labels:
          service: ole-server

  - job_name: ole-agent
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:5858
        labels:
          service: ole-agent

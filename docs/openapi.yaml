  /api/v1/peers/{peerId}/transport-identities:
    get:
      tags: [Peers]
      security: [{ bearerAuth: [] }]
      summary: Get current eligible transport device identities for an owned peer
      description: >-
        OLEP4 key snapshot, valid for at most 30 seconds. Requires an active
        local user/device, network use permission and device approval where
        required. Ineligible remote peers are omitted. Transport clients use
        binary OLP4 UDP messages and the binary OLR2 relay carrier (logical
        envelopes OLEP4 and OLER2), with a 1200-byte datagram budget, authenticated
        fragmentation and no older-wire fallback. Transport encoding limits peer
        IDs to 64 bytes, network/device IDs to 128 bytes and relay tokens to
        512 bytes. The relay carrier token remains plaintext over UDP.
      parameters:
        - in: path
          name: peerId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current key snapshot; Cache-Control is no-store
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/TransportIdentitySnapshot" }
        "400":
          description: Local device is not active
        "401":
          description: Authentication, peer ownership or network-use permission denied
        "404":
          description: Peer, network or device does not exist
        "403":
          description: Local device approval is required
        "500":
          description: Transport identity storage is unavailable
